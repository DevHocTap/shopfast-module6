name: Deploy

# Runs only after CI succeeded on a push to main, or manually to redeploy a given commit.
#
#   build    (GitHub-hosted)  build api/web images, push to GHCR with the per-job GITHUB_TOKEN
#   deploy   (self-hosted on the EC2 host)  stage infra bundle, blue/green deploy.sh
#   smoke    (GitHub-hosted)  check the public HTTPS endpoint from outside
#   rollback (self-hosted)    only when smoke fails
#
# No AWS credential exists in GitHub: AWS calls happen on the EC2 host with its instance role.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (default = current main)
        required: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
  # GHCR image names must be lowercase.
  IMAGE_REGISTRY: ghcr.io/devhoctap/shopfast-module6
  APP_URL: https://${{ vars.APP_DOMAIN }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SHA }}' }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip images that already exist (tags are treated as immutable)
        id: exists
        run: |
          for image in api web; do
            if docker buildx imagetools inspect "$IMAGE_REGISTRY/$image:$SHA" > /dev/null 2>&1; then
              echo "$image=true" >> "$GITHUB_OUTPUT"
            else
              echo "$image=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - name: Build & push api:${{ env.SHA }}
        if: steps.exists.outputs.api != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/api:${{ env.SHA }}
          build-args: APP_VERSION=${{ env.SHA }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push web:${{ env.SHA }}
        if: steps.exists.outputs.web != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/web:${{ env.SHA }}
          build-args: APP_VERSION=${{ env.SHA }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, shopfast-prod]
    environment:
      name: production
      url: ${{ env.APP_URL }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SHA }}' }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release bundle (compose, nginx, scripts)
        run: |
          RELEASE=/opt/shopfast/releases/$SHA
          rm -rf "$RELEASE" && mkdir -p "$RELEASE"
          cp -r infra/compose infra/nginx infra/scripts infra/postgres "$RELEASE/"
          chmod +x "$RELEASE"/scripts/*.sh "$RELEASE"/postgres/init/*.sh

      - name: Blue/green deploy
        run: |
          "/opt/shopfast/releases/$SHA/scripts/deploy.sh" "$SHA"

      - name: Forget registry credentials
        if: always()
        run: docker logout ghcr.io || true

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test through public HTTPS
        run: |
          for attempt in $(seq 1 10); do
            live=$(curl -fsS "$APP_URL/api/health/live" || true)
            ready_code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/health/ready" || true)
            home_code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/" || true)
            echo "attempt $attempt: live=$live ready=$ready_code home=$home_code"
            if echo "$live" | grep -q "\"version\":\"$SHA\"" && [ "$ready_code" = 200 ] && [ "$home_code" = 200 ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Smoke test failed for $SHA"
          exit 1

  rollback:
    needs: [deploy, smoke]
    if: failure() && needs.smoke.result == 'failure'
    runs-on: [self-hosted, shopfast-prod]
    steps:
      - name: Roll back to the previous version
        run: |
          /opt/shopfast/current/scripts/rollback.sh
          echo "::error::Deployment of $SHA failed the smoke test and was rolled back"
          exit 1
